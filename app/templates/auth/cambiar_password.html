{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Cambiar contraseña</h1>
  {% if obligatorio %}
  <p>Antes de continuar debe reemplazar su contraseña temporal.</p>
  {% endif %}
  <form method="post" action="{{ url_for('auth.cambiar_password') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" required autofocus>
    <label for="nueva">Nueva contraseña</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="10" required
           aria-describedby="ayuda-nueva">
    <small id="ayuda-nueva">Mínimo 10 caracteres.</small>
    <label for="confirmacion">Repita la nueva contraseña</label>
    <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" required>
    <button type="submit" class="primario">Guardar</button>
  </form>
</section>
{% endblock %}
