{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Iniciar sesión</h1>
  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if destino %}<input type="hidden" name="next" value="{{ destino }}">{% endif %}
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primario">Ingresar</button>
  </form>
  <p class="nota">¿Olvidó su contraseña? Solicite al Administrador que la restablezca.</p>
</section>
{% endblock %}
